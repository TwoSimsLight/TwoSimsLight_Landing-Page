    <style>
        .btn-minigame {

        .tooltip-container {
            position: relative;

        }
        .tooltip-box {
            visibility: hidden;
            background-color: #222;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px 10px;
            position: absolute;
            z-index: 1;
            top: 150%; 
            left: 50%;
            margin-left: -70px;
            opacity: 0;
            transition: opacity 0.3s;
            white-space: nãowrap;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.3);
            border: 1px solid #444;
        }
        .tooltip-box::after {
            content: "";
            position: absolute;
            bottom: 100%; top: auto;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: transparent transparent #222 transparent;
        }
        .tooltip-container:hover .tooltip-box {
            visibility: visible;
            opacity: 1;
        }
    </style>

            try {
                firebase.initializeApp(firebaseConfig);
                var db = firebase.database();
                
                // Fetch player count
                var fetched = false;
                db.ref('scores').on('value', function(snapshot) {
                    fetched = true;
                    var count = snapshot.numChildren();
                    document.getElementById('play-count-text').innerText = '🔥 ' + count + ' people played this!';
                });
                
                // Fallback Se o Firebase falhar ou demorar muito (sem chaves)
                setTimeout(function() {
                    if (!fetched) {
                        document.getElementById('play-count-text').innerText = '🔥 Join the players nãow!';
                    }
                }, 3000);
            } catch(e) {
                console.warn("Firebase Tooltip não configurado ainda.");

        }
